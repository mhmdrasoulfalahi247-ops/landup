<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <title>Persian: Isfahan-inspired square at sunset</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16425b"/>
      <stop offset="0.55" stop-color="#d98c5f"/>
      <stop offset="1" stop-color="#f7d6a3"/>
    </linearGradient>
    <linearGradient id="pool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b7a8c"/>
      <stop offset="1" stop-color="#123447"/>
    </linearGradient>
    <pattern id="tiles" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect width="28" height="28" fill="#1f8a96"/>
      <path d="M14 2 L26 14 L14 26 L2 14 Z" fill="none" stroke="#7fd1c7" stroke-width="2"/>
      <circle cx="14" cy="14" r="3" fill="#f2d18b"/>
    </pattern>
    <pattern id="arcade" width="80" height="140" patternUnits="userSpaceOnUse" y="560">
      <rect width="80" height="140" fill="#c98a52"/>
      <path d="M14 140 V82 C14 60 30 48 40 40 C50 48 66 60 66 82 V140 Z" fill="#6e3f25"/>
    </pattern>
    <clipPath id="poolClip"><rect x="0" y="760" width="1600" height="240"/></clipPath>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="1180" cy="420" r="150" fill="#ffe2b0" opacity="0.65"/>
  <path d="M0 600 L180 520 L330 570 L520 470 L700 560 L900 500 L1100 560 L1300 480 L1600 580 V700 H0 Z" fill="#a8705a" opacity="0.55"/>

  <g id="square">
    <rect x="0" y="560" width="1600" height="140" fill="url(#arcade)"/>
    <rect x="0" y="548" width="1600" height="14" fill="#a96f3f"/>

    <rect x="360" y="500" width="120" height="60" fill="#e3b778"/>
    <path d="M340 505 C340 420 395 395 420 360 C445 395 500 420 500 505 Z" fill="url(#tiles)"/>
    <rect x="1120" y="500" width="120" height="60" fill="#e3b778"/>
    <path d="M1100 505 C1100 420 1155 395 1180 360 C1205 395 1260 420 1260 505 Z" fill="#c9a05a"/>

    <path d="M630 430 C630 250 750 190 800 130 C850 190 970 250 970 430 Z" fill="url(#tiles)"/>
    <line x1="800" y1="130" x2="800" y2="88" stroke="#f2d18b" stroke-width="6"/>
    <circle cx="800" cy="84" r="9" fill="#f2d18b"/>

    <g fill="url(#tiles)">
      <rect x="642" y="240" width="34" height="460"/>
      <rect x="924" y="240" width="34" height="460"/>
    </g>
    <g fill="#e3b778">
      <rect x="632" y="300" width="54" height="16"/>
      <rect x="914" y="300" width="54" height="16"/>
      <path d="M642 240 C642 214 659 204 659 190 C659 204 676 214 676 240 Z"/>
      <path d="M924 240 C924 214 941 204 941 190 C941 204 958 214 958 240 Z"/>
    </g>

    <rect x="696" y="370" width="208" height="330" fill="#e3b778"/>
    <rect x="712" y="386" width="176" height="314" fill="url(#tiles)"/>
    <path d="M738 700 V530 C738 488 772 466 800 450 C828 466 862 488 862 530 V700 Z" fill="#2d1b12"/>
    <path d="M760 700 V560 C760 532 782 516 800 506 C818 516 840 532 840 560 V700 Z" fill="#4a2e1f"/>
  </g>

  <g fill="#2f5d3a">
    <ellipse cx="200" cy="610" rx="22" ry="92"/>
    <ellipse cx="560" cy="615" rx="20" ry="86"/>
    <ellipse cx="1040" cy="615" rx="20" ry="86"/>
    <ellipse cx="1400" cy="610" rx="22" ry="92"/>
  </g>

  <rect x="0" y="700" width="1600" height="60" fill="#d9b382"/>
  <rect x="0" y="752" width="1600" height="8" fill="#a97f52"/>
  <rect x="0" y="760" width="1600" height="240" fill="url(#pool)"/>
  <g clip-path="url(#poolClip)" opacity="0.22">
    <use href="#square" transform="translate(0 1520) scale(1 -1)"/>
  </g>
  <g stroke="#9ad7da" stroke-width="3" stroke-linecap="round" opacity="0.45">
    <line x1="520" y1="820" x2="640" y2="820"/>
    <line x1="900" y1="850" x2="1060" y2="850"/>
    <line x1="700" y1="900" x2="820" y2="900"/>
    <line x1="1120" y1="930" x2="1220" y2="930"/>
  </g>
</svg>
